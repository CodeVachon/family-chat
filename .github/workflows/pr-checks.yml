name: PR Checks — Fallow, Prettier, ESLint

# Runs on every PR open/update. Fallow audits the changeset, Prettier checks the
# changed files, and ESLint lints the workspace. All three run even if an earlier
# one fails, so a single run surfaces every problem.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel superseded runs when a PR is pushed again.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so Fallow and the diff can reach the PR base commit.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fallow gates on findings introduced by this PR (gate=new-only), diffed
      # against the base commit. Fails the step on a "fail" verdict.
      - name: Fallow audit
        if: ${{ !cancelled() }}
        run: bunx fallow audit --base "${{ github.event.pull_request.base.sha }}" --explain

      # Prettier in --check mode over only the files this PR touches (repo-wide
      # would trip on pre-existing/vendored files). .prettierignore still applies.
      - name: Prettier (changed files)
        if: ${{ !cancelled() }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|json|md|css|ya?ml)$' || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Prettier-relevant files changed."
            exit 0
          fi
          printf 'Checking:\n%s\n' "$(printf '  %s\n' "${files[@]}")"
          bunx prettier --check "${files[@]}"

      # ESLint runs across the workspace via Turbo (each package uses its own
      # flat config); this covers the changed files with correct config resolution.
      - name: ESLint
        if: ${{ !cancelled() }}
        run: bun run lint
