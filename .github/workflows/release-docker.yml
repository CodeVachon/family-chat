name: Release — Build & Push Docker Image

# Builds the production image and pushes it to GitHub Container Registry when a
# release is created. Sentry source maps are uploaded during the build: the org
# and project come through as build args and the auth token is passed as a build
# secret (so it never lands in an image layer — see the Dockerfile).
#
# Triggered when a release is published (tag finalized), so drafts don't build.
on:
  release:
    types: [published]

# Lowercase image name — GHCR rejects uppercase, and the owner (CodeVachon) is
# mixed-case, so it's hardcoded here rather than derived from github.repository.
env:
  IMAGE: ghcr.io/codevachon/family-chat

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (release tag)
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE }}:latest
          # Non-secret Sentry config (DSN is a public client identifier). The
          # client DSN must be inlined at build time to reach the browser.
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          # The auth token (source-map upload) is passed as a build secret and
          # consumed via `--mount=type=secret,id=sentry_auth_token` in the
          # Dockerfile, so it is never written to an image layer.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
